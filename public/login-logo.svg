<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="cc-bg" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cc-core" x1="40" y1="40" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <radialGradient id="cc-glow" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Rounded squircle badge -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#cc-bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#cc-glow)"/>
  <!-- Outer cellular hexagon frame -->
  <polygon
    points="64,20 102,42 102,86 64,108 26,86 26,42"
    stroke="#ffffff"
    stroke-width="4.5"
    stroke-linejoin="round"
    fill="rgba(15,23,42,0.18)"
  />
  <!-- Inner hexagonal signal ring (dashed 3-sector symmetry) -->
  <polygon
    points="64,34 90,49 90,79 64,94 38,79 38,49"
    stroke="#ffffff"
    stroke-opacity="0.55"
    stroke-width="2.5"
    stroke-linejoin="round"
    stroke-dasharray="18 12"
  />
  <!-- 3-sector RF spokes from core to alternate vertices -->
  <path
    d="M64 64 L64 23 M64 64 L99.5 84.5 M64 64 L28.5 84.5"
    stroke="#ffffff"
    stroke-opacity="0.45"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <!-- Radiating RF arcs -->
  <path d="M51 50.5 A19 19 0 0 1 77 50.5" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M82.5 57 A19 19 0 0 1 71 81.5" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M57 81.5 A19 19 0 0 1 45.5 57" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round"/>
  <!-- Precision glowing center core -->
  <circle cx="64" cy="64" r="10.5" fill="url(#cc-core)"/>
  <circle cx="64" cy="64" r="4.5" fill="#1d4ed8"/>
  <!-- Corner vertex signal nodes -->
  <circle cx="64" cy="20" r="4" fill="#ffffff"/>
  <circle cx="102" cy="86" r="4" fill="#ffffff"/>
  <circle cx="26" cy="86" r="4" fill="#ffffff"/>
</svg>
