[package]
name = "cellcored"
version = "1.9.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/GizmoTickler/CellCore"

[[bin]]
name = "cellcored"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "fs", "io-util", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "ws", "tokio", "query", "matched-path"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "compression-br", "compression-gzip", "set-header"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy", "http1", "http2"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "logging"] }
rustls-rustcrypto = { version = "0.1.0-pre.0", default-features = false, features = ["std", "tls12", "zeroize"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
getrandom = "0.2"
hex = "0.4"
libc = "0.2"

[dev-dependencies]
# Paused-clock tests (body deadlines); same crate, no new dependency.
tokio = { version = "1", features = ["test-util"] }
